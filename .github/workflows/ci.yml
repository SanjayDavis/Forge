name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Compliance suite
        run: python -m unittest tests.compliance.test_compliance

      - name: CLI smoke test
        run: |
          forge -d /tmp/ci-demo init
          cd /tmp/ci-demo
          forge create "CI Demo" --desc "smoke" -a "passes" --priority high
          forge next
          forge progress

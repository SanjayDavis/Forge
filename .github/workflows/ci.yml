name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install -e packages/forge-planner
          python -m pip install -e packages/forge-mcp

      - name: Test suite (warnings are errors)
        run: python -W error -m unittest discover -s tests

      - name: Compliance suite (warnings are errors)
        run: python -W error -m unittest tests.compliance.test_compliance

      - name: CLI smoke test
        run: |
          forge -d /tmp/ci-demo init
          cd /tmp/ci-demo
          forge plan "CI Demo" --commit
          forge next
          forge progress

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m build packages/forge-planner
          python -m build packages/forge-mcp

      - name: Install the wheels into a clean venv
        run: |
          python -m venv /tmp/forge-venv
          /tmp/forge-venv/bin/pip install dist/*.whl packages/forge-planner/dist/*.whl packages/forge-mcp/dist/*.whl

      - name: forge --help works from the installed wheels
        run: |
          cd /tmp
          /tmp/forge-venv/bin/forge --help >/dev/null
          /tmp/forge-venv/bin/python -c "import forge; print(forge.__version__)"
          /tmp/forge-venv/bin/python -c "from forge import ForgeClient, PLANNER_OPS, validate_proposal; print('SDK ok')"
          /tmp/forge-venv/bin/python -c "from forge_planner import ReferencePlanner; print('planner package ok')"
          /tmp/forge-venv/bin/forge-mcp --help >/dev/null
          /tmp/forge-venv/bin/python -c "from forge_mcp import ForgeMCPServer, TOOLS; assert len(TOOLS) == 6; print('mcp package ok')"

      - name: SDK + CLI smoke against the installed packages
        run: |
          mkdir -p /tmp/pkg-demo && cd /tmp/pkg-demo
          /tmp/forge-venv/bin/forge init
          /tmp/forge-venv/bin/forge plan "Packaged Demo" --commit
          /tmp/forge-venv/bin/forge next
          /tmp/forge-venv/bin/python - <<'EOF'
          from forge import ForgeClient
          c = ForgeClient(".")
          t = c.next()
          assert t is not None and t["id"].startswith("packaged-demo")
          assert "Constraints:" in c.context(t["id"])
          print("installed-package SDK smoke: ok")
          EOF

      - name: sdist installs too
        run: |
          python -m venv /tmp/forge-sdist-venv
          /tmp/forge-sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/forge-sdist-venv/bin/forge --help >/dev/null

      - name: MCP wire smoke against the installed package
        run: |
          mkdir -p /tmp/pkg-mcp-demo
          cd /tmp/pkg-mcp-demo
          /tmp/forge-venv/bin/forge init
          /tmp/forge-venv/bin/python - <<'EOF'
          import json, subprocess
          p = subprocess.Popen(
              ["/tmp/forge-venv/bin/forge-mcp", "-d", "."],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.PIPE, text=True, encoding="utf-8")
          def rpc(mid, method, params=None):
              payload = {"jsonrpc": "2.0", "id": mid, "method": method}
              if params is not None:
                  payload["params"] = params
              p.stdin.write(json.dumps(payload) + "\n")
              p.stdin.flush()
              return json.loads(p.stdout.readline())
          init = rpc(1, "initialize", {"protocolVersion": "2025-11-25",
                                       "capabilities": {}})
          assert init["result"]["serverInfo"]["name"] == "forge", init
          tools = rpc(2, "tools/list")
          names = [t["name"] for t in tools["result"]["tools"]]
          assert names == ["forge_next", "forge_context", "forge_propose",
                           "forge_verify", "forge_query", "forge_replay"], names
          nxt = rpc(3, "tools/call", {"name": "forge_next", "arguments": {}})
          assert not nxt["result"]["isError"]
          p.stdin.close(); p.wait(timeout=10)
          print("installed forge-mcp wire smoke: ok")
          EOF

      - name: bare forge install prints the plan install hint
        run: |
          python -m venv /tmp/forge-bare-venv
          /tmp/forge-bare-venv/bin/pip install dist/forge_foundation-*.whl
          cd /tmp/pkg-demo
          /tmp/forge-bare-venv/bin/forge plan "x" 2>&1 | grep -q "pip install forge-planner" || \
            (echo "FAIL: bare forge install must hint at forge-planner" && exit 1)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0a1"
description = "Forge - a deterministic project kernel for autonomous software development"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkernel"
version = "0.1.0"
description = "Project Kernel - an AI-agnostic, event-sourced task graph engine. Deterministic core; LLMs are just clients."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
pk = "pkernel.cli:main"

[tool.setuptools]
packages = ["pkernel"]

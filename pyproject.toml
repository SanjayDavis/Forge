[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "1.0.0"
description = "Project Kernel - a deterministic execution engine for autonomous software development"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkernel"
version = "0.2.0"
description = "Project Kernel - a deterministic execution engine for autonomous software development"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
pk = "pkernel.cli:main"

[tool.setuptools]
packages = ["pkernel"]
